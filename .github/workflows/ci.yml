name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Node 24 is what the project is developed and built against.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # No build artifact is uploaded on purpose.
      #
      # `.next` is ~570 MB (about half of it the Turbopack cache), and
      # upload-artifact skips dotfiles by default — "hidden files are defined
      # as any file beginning with '.'" — so uploading it needs
      # `include-hidden-files: true` and would then ship hundreds of megabytes
      # per run. Nothing consumes it either: Vercel builds from source itself,
      # and the step above already proves the build succeeds.
      #
      # If a deployable artifact is ever needed, add it back as:
      #   - uses: actions/upload-artifact@v7
      #     with:
      #       name: next-build
      #       include-hidden-files: true
      #       path: |
      #         .next
      #         !.next/cache
